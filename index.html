<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14213d">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Máscara IA</title>
<style>
:root{--bg:#14213d;--panel:#1d2d50;--ink:#f5f1e8;--mute:#a9b3c9;--acc:#fca311;--line:#2f4170}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:720px;margin:0 auto;padding:12px}
h1{font-size:1.4rem;margin:4px 0 12px}
.stage{position:relative;background:#000;border-radius:14px;overflow:hidden;aspect-ratio:4/3}
#out{width:100%;height:100%;display:block;transform:scaleX(-1)}
#remote{position:absolute;right:8px;bottom:8px;width:32%;border-radius:10px;border:2px solid var(--acc);background:#000;display:none}
#msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;color:var(--mute)}
section{background:var(--panel);border-radius:14px;padding:14px;margin-top:12px}
h2{font-size:1rem;margin:0 0 10px}
button,.btn{background:var(--acc);color:#14213d;border:0;border-radius:10px;padding:12px 16px;font:600 1rem inherit;font-family:inherit;cursor:pointer;min-height:44px}
button.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
label.s{display:grid;grid-template-columns:1fr auto;gap:2px 8px;margin:10px 0;color:var(--mute);font-size:.9rem}
label.s input{grid-column:1/3;width:100%;accent-color:var(--acc)}
label.t{display:flex;gap:8px;align-items:center;margin:8px 0}
input[type=text]{background:#0f1a33;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:11px;font-size:1rem;min-width:0;flex:1}
#gal{display:flex;gap:8px;overflow-x:auto;margin-top:10px}
#gal img{width:64px;height:64px;object-fit:cover;border-radius:10px;border:2px solid transparent;cursor:pointer}
#gal img.on{border-color:var(--acc)}
small{color:var(--mute)}
code{background:#0f1a33;padding:2px 6px;border-radius:6px}
</style>
</head>
<body>
<main>
<h1>Máscara IA</h1>
<div class="stage">
  <canvas id="out" width="640" height="480"></canvas>
  <video id="remote" autoplay playsinline></video>
  <div id="msg">Pulsa «Activar cámara» y sube una foto de una cara de frente.</div>
</div>

<section>
  <div class="row">
    <button id="bCam">Activar cámara</button>
    <label class="btn alt" style="display:inline-flex;align-items:center;border:1px solid var(--line);color:var(--ink);background:transparent">Subir cara<input id="file" type="file" accept="image/*" hidden></label>
  </div>
  <div id="gal"></div>
  <small id="status"></small>
</section>

<section>
  <h2>Ajustes</h2>
  <label class="s"><span>Intensidad (tu cara ↔ la cara subida)</span><b id="vI">90%</b><input id="rI" type="range" min="0" max="100" value="90"></label>
  <label class="s"><span>Adaptar tono de piel al tuyo</span><b id="vT">40%</b><input id="rT" type="range" min="0" max="100" value="40"></label>
  <label class="s"><span>Suavizar bordes</span><b id="vF">14</b><input id="rF" type="range" min="0" max="40" value="14"></label>
  <label class="t"><input id="cMouth" type="checkbox" checked> Mantener mi boca real al abrirla</label>
  <label class="t"><input id="cLabel" type="checkbox" checked> Mostrar etiqueta «Cara generada por IA»</label>
</section>

<section>
  <h2>Videollamada</h2>
  <div class="row">
    <span>Tu código: <code id="myId">…</code></span>
    <button class="alt" id="bCopy">Copiar</button>
  </div>
  <div class="row" style="margin-top:10px">
    <input id="peerId" type="text" placeholder="Código de la otra persona" autocapitalize="off">
    <button id="bCall">Llamar</button>
    <button class="alt" id="bHang">Colgar</button>
  </div>
  <small>La otra persona abre esta misma web y te da su código. Para Zoom/Meet en ordenador, mira el archivo LEEME.</small>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/delaunator@5.0.1/delaunator.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script type="module">
import {FaceLandmarker, FilesetResolver} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";
const $ = id => document.getElementById(id);
const out = $('out'), ctx = out.getContext('2d', {willReadFrequently:true});
const W = out.width, H = out.height;
const mk = () => { const c = document.createElement('canvas'); c.width=W; c.height=H; return c; };
const layer = mk(), lctx = layer.getContext('2d'), mask = mk(), mctx = mask.getContext('2d');
const vid = document.createElement('video'); vid.playsInline = true; vid.muted = true;

const OVAL=[10,338,297,332,284,251,389,356,454,323,361,288,397,365,379,378,400,377,152,148,176,149,150,136,172,58,132,93,234,127,162,21,54,103,67,109];
const INNER_LIP=new Set([78,191,80,81,82,13,312,311,310,415,308,324,318,402,317,14,87,178,88,95]);
const CHEEKS=[50,280,205,425,4];

let landmarker, stream, ref=null, tris=[], refPts=[], refTone=[128,128,128], peer, call, galleryN=0;
const st = t => $('status').textContent = t;

async function initModel(){
  st('Cargando modelo de cara (solo la primera vez)…');
  const fs = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  landmarker = await FaceLandmarker.createFromOptions(fs, {
    baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task", delegate:"GPU"},
    runningMode:"VIDEO", numFaces:1
  });
  st('Modelo listo.');
}
const modelReady = initModel().catch(e => st('Error cargando el modelo: ' + e.message + '. Revisa tu conexión.'));

function sampleTone(c, pts, w, h){
  let r=0,g=0,b=0,n=0;
  for(const i of CHEEKS){
    const x=Math.max(2,Math.min(w-3,Math.round(pts[i].x*w))), y=Math.max(2,Math.min(h-3,Math.round(pts[i].y*h)));
    const d=c.getImageData(x-2,y-2,5,5).data;
    for(let k=0;k<d.length;k+=4){r+=d[k];g+=d[k+1];b+=d[k+2];n++}
  }
  return [r/n,g/n,b/n];
}

async function setReference(img, thumb){
  await modelReady;
  if(!landmarker) return;
  landmarker.setOptions({runningMode:"IMAGE"});
  const res = landmarker.detect(img);
  landmarker.setOptions({runningMode:"VIDEO"});
  if(!res.faceLandmarks.length){ st('No se detecta una cara en esa foto. Usa una de frente y bien iluminada.'); return; }
  const lm = res.faceLandmarks[0];
  const w = img.naturalWidth, h = img.naturalHeight;
  const c = document.createElement('canvas'); c.width=w; c.height=h;
  const cx = c.getContext('2d', {willReadFrequently:true}); cx.drawImage(img,0,0);
  refPts = lm.slice(0,468).map(p => ({x:p.x*w, y:p.y*h}));
  tris = Delaunator.from(refPts.map(p=>[p.x,p.y])).triangles;
  refTone = sampleTone(cx, lm, w, h);
  ref = c;
  st('Cara lista. ¡Ya puedes moverte!');
}

function addToGallery(img){
  const t = document.createElement('img'); t.src = img.src; t.alt = 'Cara ' + (++galleryN);
  t.onclick = async () => { [...$('gal').children].forEach(x=>x.classList.remove('on')); t.classList.add('on'); await setReference(img); };
  $('gal').appendChild(t); t.click();
}
$('file').onchange = e => {
  const f = e.target.files[0]; if(!f) return;
  const img = new Image(); img.onload = () => addToGallery(img); img.src = URL.createObjectURL(f);
  e.target.value = '';
};

async function startCam(){
  if(stream) return stream;
  try{
    const cam = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:640,height:480}, audio:true});
    vid.srcObject = cam; await vid.play();
    const outStream = out.captureStream(30);
    cam.getAudioTracks().forEach(t => outStream.addTrack(t));
    stream = outStream; $('msg').style.display='none'; $('bCam').textContent='Cámara activa';
    requestAnimationFrame(loop);
    return stream;
  }catch(e){ st('No se pudo abrir la cámara: ' + e.message + ' (la web debe abrirse con https).'); }
}
$('bCam').onclick = startCam;

function inLipRegion(a,b,c){ return INNER_LIP.has(a)&&INNER_LIP.has(b)&&INNER_LIP.has(c); }

function drawTri(c, img, s0,s1,s2, d0,d1,d2){
  const cx=(d0.x+d1.x+d2.x)/3, cy=(d0.y+d1.y+d2.y)/3;
  const ex = p => { const dx=p.x-cx, dy=p.y-cy, l=Math.hypot(dx,dy)||1; return {x:p.x+dx/l*0.8, y:p.y+dy/l*0.8}; };
  const e0=ex(d0), e1=ex(d1), e2=ex(d2);
  const det = s0.x*(s1.y-s2.y)+s1.x*(s2.y-s0.y)+s2.x*(s0.y-s1.y);
  if(Math.abs(det)<1e-6) return;
  const a=(d0.x*(s1.y-s2.y)+d1.x*(s2.y-s0.y)+d2.x*(s0.y-s1.y))/det;
  const b=(d0.y*(s1.y-s2.y)+d1.y*(s2.y-s0.y)+d2.y*(s0.y-s1.y))/det;
  const cc=(d0.x*(s2.x-s1.x)+d1.x*(s0.x-s2.x)+d2.x*(s1.x-s0.x))/det;
  const d=(d0.y*(s2.x-s1.x)+d1.y*(s0.x-s2.x)+d2.y*(s1.x-s0.x))/det;
  const e=(d0.x*(s1.x*s2.y-s2.x*s1.y)+d1.x*(s2.x*s0.y-s0.x*s2.y)+d2.x*(s0.x*s1.y-s1.x*s0.y))/det;
  const f=(d0.y*(s1.x*s2.y-s2.x*s1.y)+d1.y*(s2.x*s0.y-s0.x*s2.y)+d2.y*(s0.x*s1.y-s1.x*s0.y))/det;
  c.save(); c.beginPath(); c.moveTo(e0.x,e0.y); c.lineTo(e1.x,e1.y); c.lineTo(e2.x,e2.y); c.closePath(); c.clip();
  c.transform(a,b,cc,d,e,f); c.drawImage(img,0,0); c.restore();
}

let lastT=-1;
function loop(){
  requestAnimationFrame(loop);
  if(vid.readyState<2) return;
  ctx.drawImage(vid,0,0,W,H);
  if(!landmarker || !ref) { label(); return; }
  const now = performance.now(); if(now===lastT) return; lastT=now;
  const res = landmarker.detectForVideo(vid, now);
  if(!res.faceLandmarks.length){ label(); return; }
  const lm = res.faceLandmarks[0];
  const dst = lm.slice(0,468).map(p => ({x:p.x*W, y:p.y*H}));
  const intensity = $('rI').value/100, tone = $('rT').value/100, feather = +$('rF').value, keepMouth = $('cMouth').checked;

  lctx.clearRect(0,0,W,H);
  for(let i=0;i<tris.length;i+=3){
    const a=tris[i],b=tris[i+1],c=tris[i+2];
    if(keepMouth && inLipRegion(a,b,c)) continue;
    drawTri(lctx, ref, refPts[a],refPts[b],refPts[c], dst[a],dst[b],dst[c]);
  }
  if(tone>0){
    const me = sampleTone(ctx, lm, W, H);
    lctx.globalCompositeOperation='source-atop';
    lctx.fillStyle=`rgba(${me[0]|0},${me[1]|0},${me[2]|0},${tone*0.5})`;
    lctx.fillRect(0,0,W,H);
    lctx.globalCompositeOperation='source-over';
  }
  // máscara con bordes suaves (shadowBlur funciona también en Safari)
  mctx.clearRect(0,0,W,H);
  const OFF=5000;
  mctx.save(); mctx.shadowColor='#000'; mctx.shadowBlur=feather; mctx.shadowOffsetX=OFF; mctx.fillStyle='#000';
  mctx.beginPath(); OVAL.forEach((i,k)=>{const p=dst[i]; k?mctx.lineTo(p.x-OFF,p.y):mctx.moveTo(p.x-OFF,p.y)}); mctx.closePath(); mctx.fill(); mctx.restore();
  lctx.globalCompositeOperation='destination-in'; lctx.drawImage(mask,0,0); lctx.globalCompositeOperation='source-over';

  ctx.globalAlpha = intensity; ctx.drawImage(layer,0,0); ctx.globalAlpha = 1;
  label();
}
function label(){
  if(!$('cLabel').checked) return;
  ctx.font='600 15px system-ui'; const t='Cara generada por IA'; const w=ctx.measureText(t).width+16;
  ctx.fillStyle='rgba(0,0,0,.6)'; ctx.fillRect(8,H-34,w,26); ctx.fillStyle='#fff'; ctx.fillText(t,16,H-16);
}
[['rI','vI','%'],['rT','vT','%'],['rF','vF','']].forEach(([r,v,u])=>$(r).oninput=()=>$(v).textContent=$(r).value+u);

// ---- Videollamada (WebRTC directo con PeerJS, gratis) ----
const code = Math.random().toString(36).slice(2,8);
$('myId').textContent = code;
try{
  peer = new Peer('mascara-'+code);
  peer.on('call', async c => { const s = await startCam(); if(!s) return; c.answer(s); hook(c); });
  peer.on('error', e => st('Llamada: '+e.type));
}catch(e){ st('No se pudo iniciar la llamada: '+e.message); }
function hook(c){
  call = c;
  c.on('stream', s => { const r=$('remote'); r.srcObject=s; r.style.display='block'; });
  c.on('close', () => { $('remote').style.display='none'; });
}
$('bCall').onclick = async () => {
  const id = $('peerId').value.trim().toLowerCase(); if(!id) return;
  const s = await startCam(); if(!s) return;
  hook(peer.call('mascara-'+id.replace('mascara-',''), s));
};
$('bHang').onclick = () => { if(call) call.close(); $('remote').style.display='none'; };
$('bCopy').onclick = () => navigator.clipboard?.writeText(code).then(()=>st('Código copiado.'));

if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
